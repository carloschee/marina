<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>Dótir</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#062a35" />

  <!-- iOS install ("Add to Home Screen") -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dótir" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Lexend:wght@400;500;600;700&display=swap" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #062a35;
      font-family: 'Lexend', system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #root {
      width: 100vw;
      height: 100vh;
      /* Respect notches / home indicator while running standalone */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }

    /* The Marina screens are designed at 1180×820 (iPad Air 4 landscape).
       We scale-to-fit the actual viewport so it looks identical on any iPad. */
    .dotir-stage {
      position: relative;
      width: 1180px;
      height: 820px;
      transform-origin: top left;
    }

    /* Boot splash while React + Babel warm up */
    .dotir-boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #062a35;
      color: #f7f1e3;
      gap: 24px;
      z-index: 9999;
      transition: opacity .4s;
    }
    .dotir-boot.ready { opacity: 0; pointer-events: none; }
    .dotir-boot img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .dotir-boot .name {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 36px;
      letter-spacing: -1px;
    }
    .dotir-boot .dot { display:inline-block; width:8px; height:8px; border-radius:99px; background:#38d9a9; margin:0 3px; animation: dot 1.2s infinite ease-in-out; }
    .dotir-boot .dot:nth-child(2){ animation-delay: 0.15s }
    .dotir-boot .dot:nth-child(3){ animation-delay: 0.30s }
    @keyframes dot { 0%,80%,100%{ opacity: 0.2; transform: scale(0.8);} 40%{ opacity: 1; transform: scale(1);} }

    /* Banner de actualización — sólo visible para el adulto */
    #dotir-update-banner {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      background: #0e3a48;
      color: #f7f1e3;
      font-family: 'Lexend', system-ui, sans-serif;
      font-size: 14px; font-weight: 500;
      padding: 12px 20px;
      border-radius: 99px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 14px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #dotir-update-ok {
      appearance: none; border: none; cursor: pointer;
      background: #38d9a9; color: #0a1f27;
      font-family: inherit; font-weight: 700; font-size: 13px;
      padding: 6px 16px; border-radius: 99px;
    }
    #dotir-update-dismiss {
      appearance: none; border: none; cursor: pointer;
      background: transparent; color: rgba(247,241,227,0.5);
      font-family: inherit; font-size: 18px; padding: 0 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div class="dotir-boot" id="dotir-boot">
    <img src="icons/icon-256.png" alt="Dótir" />
    <div class="name">Dótir</div>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>

  <!-- Scale-to-fit so the 1180×820 stage fits any iPad viewport -->
  <script>
    (function () {
      const STAGE_W = 1180, STAGE_H = 820;
      function fit() {
        const stage = document.querySelector('.dotir-stage');
        if (!stage) { requestAnimationFrame(fit); return; }
        const vw = window.innerWidth, vh = window.innerHeight;
        const scale = Math.min(vw / STAGE_W, vh / STAGE_H);
        const ox = Math.round((vw - STAGE_W * scale) / 2);
        const oy = Math.round((vh - STAGE_H * scale) / 2);
        stage.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
      }
      const mo = new MutationObserver(fit);
      mo.observe(document.getElementById('root'), { childList: true, subtree: true });
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      requestAnimationFrame(fit);

      // Hide boot splash once #root has children (= MarinaApp mounted)
      const obs = new MutationObserver(() => {
        if (document.getElementById('root').children.length > 0) {
          document.getElementById('dotir-boot').classList.add('ready');
          setTimeout(() => document.getElementById('dotir-boot').remove(), 500);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    })();
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="marina.jsx"></script>
  <script type="text/babel" data-presets="react" src="marina-app.jsx"></script>

  <script>
    // ── Babel fallback ────────────────────────────────────────────────────────
    // Force Babel transform if auto-init hasn't fired by the time scripts load.
    (async () => {
      while (typeof Babel === 'undefined') await new Promise(r => setTimeout(r, 20));
      await new Promise(r => setTimeout(r, 1200));
      if (typeof window.MarinaHome === 'undefined' && !window.__babelManualRan) {
        window.__babelManualRan = true;
        try { Babel.transformScriptTags(); } catch (e) { console.error('[babel]', e); }
      }
    })();

    // ── Service Worker ────────────────────────────────────────────────────────
    // Registro robusto con detección de nueva versión y banner de actualización.
    // El SW nuevo espera confirmación para activarse — la niña no ve nada
    // disruptivo; el adulto ve un banner discreto en la esquina inferior.
    (function () {
      if (!('serviceWorker' in navigator)) return;

      window.addEventListener('load', async () => {
        let reg;
        try {
          reg = await navigator.serviceWorker.register('./sw.js');
        } catch (err) {
          console.warn('[sw] register failed', err);
          return;
        }

        // Nueva versión instalándose — escucha su ciclo de vida
        const onUpdateFound = () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            // 'installed' con un controlador activo = nueva versión lista,
            // vieja aún corriendo → ofrecemos al adulto actualizar.
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(reg);
            }
          });
        };
        reg.addEventListener('updatefound', onUpdateFound);

        // Edge case: SW ya en waiting al cargar (ej. tab duplicada)
        if (reg.waiting && navigator.serviceWorker.controller) {
          showUpdateBanner(reg);
        }

        // Tras activación del nuevo SW, recargamos para servir assets frescos.
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });

      function showUpdateBanner(reg) {
        if (document.getElementById('dotir-update-banner')) return;
        const banner = document.createElement('div');
        banner.id = 'dotir-update-banner';
        banner.setAttribute('role', 'status');
        banner.innerHTML = `
          <span>Nueva versión disponible</span>
          <button id="dotir-update-ok">Actualizar</button>
          <button id="dotir-update-dismiss" aria-label="cerrar">×</button>
        `;
        document.body.appendChild(banner);
        document.getElementById('dotir-update-ok').addEventListener('click', () => {
          banner.remove();
          reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
        });
        document.getElementById('dotir-update-dismiss').addEventListener('click', () => {
          banner.remove();
        });
      }
    })();

    // ── Gesto PIN — esquina superior izquierda ────────────────────────────────
    // 3 toques rápidos en la esquina superior izquierda abre el área de adultos
    // (alternativa al gesto de 5 toques en la esquina inferior derecha).
    let topTapCount = 0, topTapTimer = null;
    document.addEventListener('pointerdown', (e) => {
      if (e.clientX < 80 && e.clientY < 80) {
        topTapCount++;
        clearTimeout(topTapTimer);
        topTapTimer = setTimeout(() => topTapCount = 0, 1500);
        if (topTapCount >= 3) {
          topTapCount = 0;
          const btn = document.querySelector('[aria-label="área de adultos"]');
          for (let i = 0; i < 5; i++) btn?.click();
        }
      }
    });
  </script>
</body>
</html>
